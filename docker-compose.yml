services:

  postgres:
    image: postgres:16
    container_name: procureops-postgres

    environment:
      POSTGRES_DB: procureops
      POSTGRES_USER: procureops
      POSTGRES_PASSWORD: procureops_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureops -d procureops"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: procureops-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: procureops-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - chroma_data:/app/data/chroma_db


  frontend:
    build:
      context: ./frontend

    container_name: procureops-frontend

    env_file:
      - ./frontend/.env

    environment:
      VITE_API_BASE_URL: http://localhost:8000

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data:
  redis_data:
  chroma_data: